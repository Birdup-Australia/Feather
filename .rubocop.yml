AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable

plugins:
  - rubocop-rspec

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Methods that only build a hash of result attributes are data, not logic.
Metrics/MethodLength:
  CountAsOne:
    - hash
